name: Security audit

on:
  schedule:
    - cron: "41 4 * * 4"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
      - name: Install audit tooling
        run: uv sync --locked --group audit
      - name: Export runtime requirements
        run: uv export --quiet --locked --no-default-groups --format requirements-txt --output-file /tmp/runtime-requirements.txt
      - name: Audit runtime dependencies
        run: uv run --locked --group audit pip-audit --disable-pip --require-hashes --requirement /tmp/runtime-requirements.txt
