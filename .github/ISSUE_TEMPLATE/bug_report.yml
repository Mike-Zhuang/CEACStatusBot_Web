name: Bug report
description: Report a reproducible defect without sharing personal or production data.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve CEACStatusBot. Do not paste passport numbers, visa application numbers, portal credentials, cookies, SMTP passwords, databases, screenshots containing personal data, or production logs.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use redacted examples only.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Area
      options:
        - CEAC monitoring
        - IRCC Portal monitoring
        - Korea Visa Portal monitoring
        - GTS passport slot monitoring
        - Email delivery
        - Frontend
        - Deployment
        - Other
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed personal data, credentials, cookies, databases, and production logs.
          required: true
