[project]
name = "ceacstatusbot"
version = "0.1.0"
description = "Self-hosted visa status monitoring console for CEAC, IRCC Portal, and Korea Visa Portal"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
authors = [
    { name = "Chengbo Zhuang" },
]
dependencies = [
    "argon2-cffi>=23.1.0",
    "apscheduler>=3.11.0",
    "beautifulsoup4>=4.15.0",
    "cryptography>=49.0.0",
    "fastapi>=0.138.1",
    "httpx>=0.28.0",
    "lxml>=6.1.0",
    "numpy>=2.4.6",
    "onnxruntime>=1.27.0",
    "pillow>=12.2.0",
    "pydantic[email]>=2.13.4",
    "python-dotenv>=1.2.2",
    "requests>=2.33.0",
    "uvicorn[standard]>=0.49.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.17",
]
audit = [
    "pip-audit>=2.10.1",
]

[tool.uv]
default-groups = []

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
pythonpath = ["."]
