[project]
name = "ceacstatusbot"
version = "0.1.0"
description = "Self-hosted visa status monitoring console for CEAC, IRCC Portal, and Korea Visa Portal"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
authors = [
    { name = "Chengbo Zhuang" },
]
dependencies = [
    "argon2-cffi>=23.1.0",
    "apscheduler>=3.11.3",
    "beautifulsoup4>=4.15.0",
    "cryptography>=50.0.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.0",
    "lxml>=6.1.0",
    "numpy>=2.5.1",
    "onnxruntime>=1.28.0",
    "pillow>=12.3.0",
    "pydantic[email]>=2.13.4",
    "python-dotenv>=1.2.2",
    "requests>=2.33.0",
    "uvicorn[standard]>=0.52.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]
audit = [
    "pip-audit>=2.10.1",
]

[tool.uv]
default-groups = []

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
pythonpath = ["."]
